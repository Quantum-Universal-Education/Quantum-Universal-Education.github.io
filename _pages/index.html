<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Full Screen D3 Map with Companies</title>
  <style>
    /* Make body and html full height, no margin */
    html, body {
      margin: 0;
      height: 100%;
      width: 100%;
      overflow: hidden;
      font-family: sans-serif;
    }
    /* Fullscreen SVG */
    svg {
      display: block;
      width: 100vw;
      height: 100vh;
      background-color: #eef2f3;
    }
    /* Tooltip styles */
    .tooltip {
      position: absolute;
      pointer-events: none;
      background-color: rgba(255, 255, 255, 0.9);
      padding: 8px;
      border: 1px solid #ccc;
      border-radius: 4px;
      box-shadow: 0 0 5px rgba(0,0,0,0.2);
      opacity: 0;
      transition: opacity 0.3s;
      max-width: 160px;
    }
    .tooltip img {
      max-width: 100%;
      display: block;
      margin-bottom: 5px;
    }
    .country {
      fill: #ccc;
      stroke: #333;
      stroke-width: 0.5px;
    }
    .company {
      fill: steelblue;
      cursor: pointer;
      transition: fill 0.3s, r 0.3s;
    }
  </style>
</head>
<body>

<svg></svg>
<div class="tooltip"></div>

<script src="https://d3js.org/d3.v7.min.js"></script>
<script src="https://unpkg.com/topojson-client@3"></script>
<script>
  const svg = d3.select("svg")
    .attr("width", window.innerWidth)
    .attr("height", window.innerHeight);

  const tooltip = d3.select(".tooltip");

  const width = window.innerWidth;
  const height = window.innerHeight;

  const projection = d3.geoMercator()
    .center([0, 20])
    .scale((width / 2 / Math.PI) * 1.3)
    .translate([width / 2, height / 2]);

  const path = d3.geoPath().projection(projection);
  const svgGroup = svg.append("g");

  Promise.all([
    d3.json("countries.json"),
    d3.json("companies.json")
  ]).then(([world, companies]) => {
    const countries = topojson.feature(world, world.objects.countries).features;

    // Draw countries
    svgGroup.selectAll("path")
      .data(countries)
      .enter().append("path")
      .attr("class", "country")
      .attr("d", path);

    // Draw logos instead of circles
    const logos = svgGroup.selectAll("image")
      .data(companies)
      .enter()
      .append("image")
      .attr("class", "company")
      .attr("href", d => d.logo_url)
      .attr("width", 24)
      .attr("height", 24)
      .attr("x", d => projection([d.lon, d.lat])[0] - 12)
      .attr("y", d => projection([d.lon, d.lat])[1] - 12)
      .style("cursor", "pointer")
      .on("mouseover", (event, d) => {
        d3.select(event.currentTarget)
          .transition().attr("width", 32).attr("height", 32)
          .attr("x", projection([d.lon, d.lat])[0] - 16)
          .attr("y", projection([d.lon, d.lat])[1] - 16);

        tooltip.transition().duration(200).style("opacity", 0.9);
        tooltip.html(`
          <figure style="margin:0;">
            <img src="${d.logo_url}" alt="${d.name} logo">
            <figcaption><strong>${d.name}</strong><br/>${d.country}</figcaption>
          </figure>
          <a href="${d.website_url}">${d.website_url}</a>
        `)
          .style("left", (event.pageX + 10) + "px")
          .style("top", (event.pageY - 40) + "px");
      })
      .on("mouseout", (event, d) => {
        d3.select(event.currentTarget)
          .transition().attr("width", 24).attr("height", 24)
          .attr("x", projection([d.lon, d.lat])[0] - 12)
          .attr("y", projection([d.lon, d.lat])[1] - 12);
        tooltip.transition().duration(500).style("opacity", 0);
      })
      .on("click", (event, d) => {
        logos.attr("stroke", null);
        d3.select(event.currentTarget)
          .attr("stroke", "red");
        console.log("Selected company:", d.name);
      });

    // Zoom behavior
    const zoom = d3.zoom()
      .scaleExtent([1, 8])
      .on("zoom", (event) => {
        svgGroup.attr("transform", event.transform);
      });

    svg.call(zoom);

    // Optional: update logo positions on window resize
    window.addEventListener("resize", () => {
      const newWidth = window.innerWidth;
      const newHeight = window.innerHeight;

      svg.attr("width", newWidth).attr("height", newHeight);

      projection
        .translate([newWidth / 2, newHeight / 2])
        .scale((newWidth / 2 / Math.PI) * 1.3);

      svg.selectAll("path.country").attr("d", path);
      svg.selectAll("image.company")
        .attr("x", d => projection([d.lon, d.lat])[0] - 12)
        .attr("y", d => projection([d.lon, d.lat])[1] - 12);
    });
  });
</script>

</body>
</html>
