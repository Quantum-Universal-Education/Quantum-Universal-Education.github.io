name: Validate React portfolio
on:
  pull_request:
    branches: [master]
  push:
    branches: [redesign-portfolio]
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npm run build
